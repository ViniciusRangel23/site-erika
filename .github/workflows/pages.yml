name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BOOKING_URL: ${{ vars.NEXT_PUBLIC_BOOKING_URL }}
          CLINIC_ADDRESS: ${{ vars.CLINIC_ADDRESS }}
          CLINIC_PHONE: ${{ vars.CLINIC_PHONE }}
          CLINIC_HOURS: ${{ vars.CLINIC_HOURS }}
          CLINIC_REGISTRATION: ${{ vars.CLINIC_REGISTRATION }}
          CLINIC_INSTAGRAM_URL: ${{ vars.CLINIC_INSTAGRAM_URL }}
          CLINIC_WHATSAPP_URL: ${{ vars.CLINIC_WHATSAPP_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
